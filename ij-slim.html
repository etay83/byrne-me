<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Interstitial Log</title>
<style>
  :root {
    --cream: #f7f3e9;
    --parchment: #ede6d6;
    --ink: #3a3228;
    --ink-light: #6b5e4f;
    --accent: #8c7a63;
    --accent-hover: #6d5e4a;
    --border: #d4c9b8;
    --muted: #a89b8a;
    --success: #5a7a5a;
    --danger: #8a5a5a;
    --font-serif: "Georgia", "Times New Roman", serif;
    --font-mono: "Courier New", Courier, monospace;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: var(--font-serif);
    background: var(--cream);
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    padding: 16px;
  }

  .widget-container {
    max-width: 520px;
    width: 100%;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 12px;
    flex: 1;
  }

  .header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    border-bottom: 1.5px solid var(--border);
    padding-bottom: 8px;
  }

  .header h1 {
    font-size: 15px;
    font-weight: normal;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-light);
  }

  .header .count {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--muted);
  }

  .input-area {
    display: flex;
    gap: 8px;
    align-items: flex-start;
  }

  .input-area textarea {
    flex: 1;
    min-height: 48px;
    max-height: 120px;
    resize: vertical;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 2px;
    background: var(--parchment);
    color: var(--ink);
    font-family: var(--font-serif);
    font-size: 13px;
    line-height: 1.5;
    outline: none;
  }

  .input-area textarea:focus {
    border-color: var(--accent);
  }

  .input-area textarea::placeholder {
    color: var(--muted);
    font-style: italic;
  }

  .log-btn {
    padding: 10px 14px;
    background: var(--accent);
    color: var(--cream);
    border: none;
    border-radius: 2px;
    font-family: var(--font-serif);
    font-size: 12px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    cursor: pointer;
    white-space: nowrap;
    transition: background 0.15s;
  }

  .log-btn:hover { background: var(--accent-hover); }
  .log-btn:active { transform: translateY(1px); }

  .entries {
    flex: 1;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 8px;
    min-height: 120px;
    max-height: 360px;
    padding-right: 4px;
  }

  .entries::-webkit-scrollbar { width: 5px; }
  .entries::-webkit-scrollbar-track { background: transparent; }
  .entries::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  .entry {
    background: var(--parchment);
    border: 1px solid var(--border);
    border-radius: 2px;
    padding: 10px 12px;
    position: relative;
    animation: fadeIn 0.25s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .entry-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 6px;
  }

  .entry-time {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--accent);
    letter-spacing: 0.04em;
  }

  .entry-delete {
    background: none;
    border: none;
    color: var(--muted);
    font-size: 15px;
    cursor: pointer;
    line-height: 1;
    padding: 0 2px;
    opacity: 0;
    transition: opacity 0.15s;
  }

  .entry:hover .entry-delete { opacity: 1; }
  .entry-delete:hover { color: var(--danger); }

  .entry-text {
    font-size: 13px;
    line-height: 1.55;
    color: var(--ink);
    word-wrap: break-word;
  }

  .empty-state {
    text-align: center;
    padding: 24px;
    color: var(--muted);
    font-size: 12px;
    font-style: italic;
  }

  .toolbar {
    display: flex;
    gap: 8px;
    justify-content: flex-end;
    padding-top: 8px;
    border-top: 1px solid var(--border);
  }

  .toolbar button {
    background: none;
    border: 1px solid var(--border);
    color: var(--ink-light);
    padding: 6px 12px;
    font-family: var(--font-serif);
    font-size: 11px;
    letter-spacing: 0.04em;
    cursor: pointer;
    border-radius: 2px;
    transition: all 0.15s;
  }

  .toolbar button:hover {
    border-color: var(--accent);
    color: var(--accent);
  }

  .status {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--muted);
    text-align: center;
    height: 14px;
    opacity: 0;
    transition: opacity 0.3s;
  }
  .status.show { opacity: 1; }

  @media (max-width: 400px) {
    .input-area { flex-direction: column; }
    .log-btn { width: 100%; }
  }
</style>
</head>
<body>
  <div class="widget-container">
    <div class="header">
      <h1>Interstitial Log</h1>
      <span class="count" id="count">0 entries</span>
    </div>

    <div class="input-area">
      <textarea id="input" placeholder="What just happened? What's next?" rows="2"></textarea>
      <button class="log-btn" id="logBtn" onclick="addEntry()">Log</button>
    </div>

    <div class="entries" id="entries"></div>

    <div class="status" id="status"></div>

    <div class="toolbar">
      <button onclick="exportMarkdown()">Export .md</button>
      <button onclick="copyLog()">Copy</button>
      <button onclick="clearAll()">Clear</button>
    </div>
  </div>

<script>
  const STORAGE_KEY = 'ij_slim_v1_' + new Date().toISOString().slice(0,10);
  const input = document.getElementById('input');
  const entriesEl = document.getElementById('entries');
  const countEl = document.getElementById('count');
  const statusEl = document.getElementById('status');

  let entries = [];

  function load() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) entries = JSON.parse(raw);
    } catch(e) { console.error('load failed', e); }
    render();
  }

  function save() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(entries));
    } catch(e) { console.error('save failed', e); }
  }

  function render() {
    entriesEl.innerHTML = '';
    if (entries.length === 0) {
      entriesEl.innerHTML = '<div class="empty-state">No transitions logged yet today.</div>';
      countEl.textContent = '0 entries';
      return;
    }
    entries.slice().reverse().forEach((entry, idx) => {
      const el = document.createElement('div');
      el.className = 'entry';
      el.innerHTML = `
        <div class="entry-header">
          <span class="entry-time">${escapeHtml(entry.time)}</span>
          <button class="entry-delete" onclick="deleteEntry(${entries.length - 1 - idx})" title="Delete">&times;</button>
        </div>
        <div class="entry-text">${escapeHtml(entry.text)}</div>
      `;
      entriesEl.appendChild(el);
    });
    countEl.textContent = entries.length + (entries.length === 1 ? ' entry' : ' entries');
  }

  function addEntry() {
    const text = input.value.trim();
    if (!text) return;
    const now = new Date();
    const time = now.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
    entries.push({ time, text, ts: now.toISOString() });
    save();
    render();
    input.value = '';
    input.focus();
    flashStatus('Logged');
  }

  function deleteEntry(index) {
    entries.splice(index, 1);
    save();
    render();
  }

  function clearAll() {
    if (!entries.length) return;
    if (!confirm('Clear all entries for today?')) return;
    entries = [];
    save();
    render();
    flashStatus('Cleared');
  }

  function exportMarkdown() {
    if (!entries.length) return;
    const date = new Date().toLocaleDateString();
    let md = `# Interstitial Log — ${date}\n\n`;
    entries.forEach(e => {
      md += `- **${e.time}** — ${e.text}\n`;
    });
    const blob = new Blob([md], {type: 'text/markdown'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `interstitial-log-${new Date().toISOString().slice(0,10)}.md`;
    a.click();
    URL.revokeObjectURL(url);
    flashStatus('Exported');
  }

  function copyLog() {
    if (!entries.length) return;
    const lines = entries.map(e => `[${e.time}] ${e.text}`).join('\n');
    navigator.clipboard.writeText(lines).then(() => flashStatus('Copied'));
  }

  function flashStatus(msg) {
    statusEl.textContent = msg;
    statusEl.classList.add('show');
    setTimeout(() => statusEl.classList.remove('show'), 1200);
  }

  function escapeHtml(str) {
    return str.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  }

  input.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      addEntry();
    }
  });

  load();
</script>
</body>
</html>
